<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated Title -->
    <title>Document Parser Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .element-card {
            border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 1rem;
            margin-bottom: 1rem; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease-in-out;
        }
        .element-card:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .element-title { background-color: #e0f2fe; }
        .element-narrativetext { background-color: #ffffff; }
        .element-table { background-color: #dcfce7; }
        .element-listitem { background-color: #fef9c3; }
        .element-header, .element-footer { background-color: #f3e8ff; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <!-- Updated Header -->
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Document Parser Inspector</h1>
            <p class="mt-2 text-lg text-gray-600">Upload a file (PDF, DOCX, PPTX, etc.) to see how it's partitioned.</p>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <div class="flex flex-col md:flex-row items-center gap-4">
                <div class="flex-grow w-full">
                    <label for="file-upload" class="sr-only">Choose a file</label>
                    <!-- Updated file input to accept more types and changed ID -->
                    <input type="file" id="file-upload" accept=".pdf,.docx,.pptx,.md,.html" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                </div>
                <button id="parse-btn" class="w-full md:w-auto bg-blue-600 text-white font-bold py-2 px-6 rounded-full hover:bg-blue-700 transition duration-300 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Parse Document
                </button>
            </div>
        </div>

        <div id="loading-spinner" class="text-center my-8 hidden">
            <!-- ... (spinner code is the same) ... -->
        </div>

        <div id="results-container"></div>
    </div>

     <script>
        const parseBtn = document.getElementById('parse-btn');
        const fileUpload = document.getElementById('file-upload');
        const resultsContainer = document.getElementById('results-container');
        const loadingSpinner = document.getElementById('loading-spinner');

        parseBtn.addEventListener('click', async () => {
            if (fileUpload.files.length === 0) {
                alert('Please select a file first.');
                return;
            }
            
            loadingSpinner.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            
            const formData = new FormData();
            formData.append("file", fileUpload.files[0]);

            try {
                const response = await fetch('/api/tools/parse-document', {
                    method: 'POST',
                    body: formData,
                });

                // --- DEBUGGING: Log the raw response ---
                console.log('API Response:', response);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to parse document');
                }

                const elements = await response.json();
                
                // --- DEBUGGING: Log the parsed elements ---
                console.log('Parsed Elements:', elements);
                
                renderElements(elements);

            } catch (error) {
                // --- DEBUGGING: Log any errors that occur ---
                console.error('An error occurred:', error);
                alert('An error occurred: ' + error.message);
                resultsContainer.innerHTML = `<p class="text-center text-red-500">Error: ${error.message}</p>`;
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        });

        function renderElements(elements) {
            if (!elements || elements.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center text-gray-500">No elements were extracted from the document.</p>';
                return;
            }

            elements.forEach(element => {
                const card = document.createElement('div');
                // Ensure element.type is a string before calling toLowerCase()
                const elementType = (element.type || 'uncategorized').toString().toLowerCase();
                card.className = `element-card element-${elementType}`;
                
                const typeBadge = document.createElement('span');
                typeBadge.className = 'inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2';
                typeBadge.textContent = element.type || 'Uncategorized';
                
                const content = document.createElement('div');
                content.className = 'text-gray-800';
                
                if (element.type === 'Table') {
                    const tableWrapper = document.createElement('div');
                    tableWrapper.className = 'overflow-x-auto';
                    tableWrapper.innerHTML = element.text;
                    const table = tableWrapper.querySelector('table');
                    if(table) {
                        table.className = 'min-w-full divide-y divide-gray-300 border border-gray-300';
                        table.querySelectorAll('th').forEach(th => th.className = 'px-4 py-2 text-left text-sm font-semibold bg-gray-100');
                        table.querySelectorAll('td').forEach(td => td.className = 'px-4 py-2 text-sm');
                    }
                    content.appendChild(tableWrapper);
                } else {
                    content.textContent = element.text;
                }

                card.appendChild(typeBadge);
                card.appendChild(content);
                resultsContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
