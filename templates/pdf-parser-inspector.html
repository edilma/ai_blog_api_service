<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Parser Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .element-card {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease-in-out;
        }
        .element-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .element-title {
            background-color: #e0f2fe; /* light blue */
        }
        .element-narrativetext {
            background-color: #ffffff; /* white */
        }
        .element-table {
            background-color: #dcfce7; /* light green */
        }
        .element-listitem {
            background-color: #fef9c3; /* light yellow */
        }
        .element-header, .element-footer {
             background-color: #f3e8ff; /* light purple */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">PDF Parser Inspector</h1>
            <p class="mt-2 text-lg text-gray-600">Upload a PDF to see how it's partitioned into structured elements.</p>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <div class="flex flex-col md:flex-row items-center gap-4">
                <div class="flex-grow w-full">
                    <label for="pdf-upload" class="sr-only">Choose a file</label>
                    <input type="file" id="pdf-upload" accept=".pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                </div>
                <button id="parse-btn" class="w-full md:w-auto bg-blue-600 text-white font-bold py-2 px-6 rounded-full hover:bg-blue-700 transition duration-300 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Parse Document
                </button>
            </div>
        </div>

        <div id="loading-spinner" class="text-center my-8 hidden">
             <div role="status" class="flex justify-center items-center">
                <svg aria-hidden="true" class="w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                    <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0492C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 40.0117 89.4855 44.2745 89.2667 48.5485C88.8235 53.222 87.2523 57.6986 84.9656 61.8454C83.1376 65.2466 80.6558 68.3274 77.6539 70.8835C74.6519 73.4397 71.1996 75.4382 67.4173 76.7441C63.635 78.05 60.028 78.6196 56.4138 78.4346C52.7996 78.2495 49.2451 77.3162 45.9101 75.6881C43.4369 74.4969 41.6133 72.2599 41.8494 69.5974C42.0856 66.9349 44.3445 65.071 47.0079 65.3071C49.3405 65.5011 51.6515 65.8616 53.9246 66.36C57.6537 67.1483 61.4237 67.1044 65.0618 66.2589C68.6999 65.4133 72.1581 63.7847 75.2567 61.4994C78.3553 59.214 81.0264 56.3335 83.0843 53.0248C85.1422 49.7161 86.5334 46.0125 87.1633 42.2299C87.4882 40.1689 88.221 38.1879 89.2667 36.3043C89.9221 34.901 90.4145 33.4332 90.7462 31.9168C91.3833 29.3591 93.9676 27.89 96.393 28.5271C97.6431 28.8422 98.6363 29.5442 99.2882 30.461C99.7176 31.1458 99.9515 31.9057 99.9828 32.6848C99.9997 33.111 99.9442 33.5354 99.8183 33.945C99.3244 35.6171 98.4333 37.1352 97.2221 38.3464C96.3895 39.1789 95.2349 39.5255 94.2099 39.4364L93.9676 39.0409Z" fill="white"/>
                </svg>
                <span class="sr-only">Loading...</span>
            </div>
            <p class="mt-4 text-gray-600">Parsing document... this may take a moment for complex PDFs.</p>
        </div>

        <div id="results-container">
            <!-- Parsed elements will be injected here -->
        </div>
    </div>

    <script>
        const parseBtn = document.getElementById('parse-btn');
        const pdfUpload = document.getElementById('pdf-upload');
        const resultsContainer = document.getElementById('results-container');
        const loadingSpinner = document.getElementById('loading-spinner');

        parseBtn.addEventListener('click', async () => {
            if (pdfUpload.files.length === 0) {
                alert('Please select a PDF file first.');
                return;
            }

            loadingSpinner.classList.remove('hidden');
            resultsContainer.innerHTML = '';
           // --- THIS IS THE NEW PART ---
            const formData = new FormData();
            formData.append("pdf_file", pdfUpload.files[0]);

            try {
                // Call your live FastAPI endpoint
                const response = await fetch('/api/tools/parse-document', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to parse document');
                }

                const elements = await response.json();
                renderElements(elements);

            } catch (error) {
                alert('An error occurred: ' + error.message);
                resultsContainer.innerHTML = `<p class="text-center text-red-500">Error: ${error.message}</p>`;
            } finally {
                loadingSpinner.classList.add('hidden');
            }
            // --- END OF NEW PART ---
        });

        function renderElements(elements) {
            if (!elements || elements.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center text-gray-500">No elements were extracted from the document.</p>';
                return;
            }

            elements.forEach(element => {
                const card = document.createElement('div');
                card.className = `element-card element-${element.type.toLowerCase()}`;
                
                const typeBadge = document.createElement('span');
                typeBadge.className = 'inline-block bg-gray-200 rounded-full px-3 py-1 text-sm font-semibold text-gray-700 mr-2 mb-2';
                typeBadge.textContent = element.type;
                
                const content = document.createElement('div');
                content.className = 'text-gray-800';
                
                // For tables, we render the HTML content directly
                if (element.type === 'Table') {
                    const tableWrapper = document.createElement('div');
                    tableWrapper.className = 'overflow-x-auto';
                    tableWrapper.innerHTML = element.text;
                    // Basic styling for the table inside the card
                    const table = tableWrapper.querySelector('table');
                    if(table) {
                        table.className = 'min-w-full divide-y divide-gray-300 border border-gray-300';
                        table.querySelectorAll('th').forEach(th => th.className = 'px-4 py-2 text-left text-sm font-semibold bg-gray-100');
                        table.querySelectorAll('td').forEach(td => td.className = 'px-4 py-2 text-sm');
                    }
                    content.appendChild(tableWrapper);
                } else {
                    content.textContent = element.text;
                }

                card.appendChild(typeBadge);
                card.appendChild(content);
                resultsContainer.appendChild(card);
            });
        }

        // This function simulates the JSON output from the unstructured library
        function generateMockResponse() {
            return [
                { "type": "Header", "text": "Page 1 of 10" },
                { "type": "Title", "text": "Official Government Report on Statistical Models" },
                { "type": "NarrativeText", "text": "This document outlines the findings of the committee on the use of statistical models in public policy. The primary focus is on ensuring accuracy and fairness in all applications." },
                { "type": "NarrativeText", "text": "Linear regression remains a foundational tool for predictive analysis. However, for classification tasks, more advanced models are recommended to avoid potential biases. The following table summarizes the approved models for different tasks." },
                { "type": "Table", "text": "<table><thead><tr><th>Task Type</th><th>Recommended Model</th><th>Notes</th></tr></thead><tbody><tr><td>Prediction (Continuous)</td><td>Linear Regression</td><td>Requires feature scaling.</td></tr><tr><td>Classification (Binary)</td><td>Logistic Regression</td><td>Interpretability is high.</td></tr><tr><td>Classification (Multi-class)</td><td>Random Forest</td><td>Less prone to overfitting.</td></tr></tbody></table>" },
                { "type": "ListItem", "text": "1. All models must be validated against a holdout dataset." },
                { "type": "ListItem", "text": "2. Source code for models must be submitted for peer review." },
                { "type": "Footer", "text": "CONFIDENTIAL - FOR INTERNAL USE ONLY" }
            ];
        }

    </script>
</body>
</html>
